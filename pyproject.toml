[project]
name = "docforge"
version = "0.1.0"
description = "Document intelligence for regulated, document-heavy operations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.43.107",
    "docling>=2.132.0",
    "fastapi>=0.142.2",
    "google-genai>=2.27.0",
    "numpy>=2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pgvector>=0.4",
    "pillow>=12",
    "procrastinate>=3.10.0",
    "psutil>=7",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "reportlab>=4.2",
    "sqlalchemy>=2.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.10",
    "pypdf>=4.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-psutil>=7.2.2.20260906",
]

# Docling needs PyTorch. On Linux the default wheel bundles CUDA (several GB); the service
# runs its models on CPU, so Linux installs the CPU-only build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=docforge --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: needs the Docker Compose services (run `make up` first)",
    "docling: runs the real Docling models (slow; downloads weights on first use)",
    "no_ambient_tenant: run without the default tenant scope, as a real request would",
]

[tool.coverage.run]
branch = true
source = ["docforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pypdfium2.*", "reportlab.*"]
ignore_missing_imports = true
