[project]
name = "docforge"
version = "0.1.0"
description = "Document intelligence for regulated, document-heavy operations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "reportlab>=4.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pypdf>=4.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=docforge --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: needs the Docker Compose services (run `make up` first)",
]

[tool.coverage.run]
branch = true
source = ["docforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
