# Local development services. Ports bind to 127.0.0.1 only; credentials are local defaults.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docforge}
      POSTGRES_DB: ${POSTGRES_DB:-docforge}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # MinIO no longer publishes official images; this is Chainguard's build of
    # RELEASE.2026-09-22T19-25-18Z, pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:0f95aa412a12351a95bb43c3b54b66440eb0aa022bb3f3458942678a489e915b
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docforge-local-secret}
      S3_BUCKET: ${S3_BUCKET:-docforge-originals}
      MC_CONFIG_DIR: /tmp/.mc
    # A directory under the data root is served as a bucket, so no separate init container.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/$${S3_BUCKET} && exec minio server /data --console-address :9001"]
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
