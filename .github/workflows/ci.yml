name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Docling downloads its layout and table models on first use.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
          key: docling-models-${{ hashFiles('uv.lock') }}
          restore-keys: docling-models-

      # Same entry points a developer uses, so CI proves the clean-machine gate.
      - name: Start services and migrate
        run: make up

      - name: Lint and type check
        run: make lint

      - name: Test
        run: make test

      # The C1 gate: the baseline report is reproduced offline from recordings.
      - name: Eval (offline replay)
        run: make eval && git diff --exit-code -- evals/baselines

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Review app (type check, lint, unit tests, build)
        run: make web-check

      # The C5 gate: a reviewer resolves a flagged document end to end in a browser,
      # against the real API, worker and database, on recorded documents (no key).
      - name: End-to-end review in a browser
        run: |
          (cd web && npx playwright install --with-deps chromium)
          make e2e

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
